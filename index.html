<header><h1>GOBLIN</h1><p>stone &middot; modeled from a single photo &middot; 2026</p></header>
<footer><div id="hint">drag to rotate &middot; pinch to zoom</div></footer>
<script>
  const mv = document.getElementById('mv'), fill = document.getElementById('fill'),
        hint = document.getElementById('hint'), header = document.querySelector('header');
  mv.addEventListener('progress', e => { fill.style.width = (e.detail.totalProgress*100)+'%'; });
  mv.addEventListener('load', () => {
    document.querySelector('.bar').classList.add('hidden');
    setTimeout(()=>hint.classList.add('hidden'), 4000);
  });
  let touched = false;
  mv.addEventListener('camera-change', e => {
    if (e.detail.source === 'user-interaction' && !touched) {
      touched = true; mv.autoRotate = false;
      hint.classList.add('hidden'); header.style.opacity = .55;
    }
  });
</script>
